name: Build iOS IPA

on:
  push:
    branches: [master, main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: go/go.sum
      - name: Fetch patched netbird
        run: scripts/fetch-netbird.sh
      - name: Test bridge
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Cross-compile for iOS (type check)
        working-directory: go
        run: GOOS=ios GOARCH=arm64 CGO_ENABLED=0 go build ./...

  build-ipa:
    needs: go-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: go/go.sum

      - name: Fetch patched netbird
        run: scripts/fetch-netbird.sh

      - name: Build NBSSHKit.xcframework (gomobile)
        working-directory: go
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../ios/Frameworks
          gomobile bind -target=ios/arm64 -iosversion=16.0 -trimpath -ldflags="-s -w" \
            -o ../ios/Frameworks/NBSSHKit.xcframework ./nbsshkit

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -skipPackagePluginValidation -skipMacroValidation \
            -project NetBirdSSH.xcodeproj -scheme NetBirdSSH \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/NetBirdSSH.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unre|ARCHIVE|BUILD|\*\*" || true
          test -d build/NetBirdSSH.xcarchive

      - name: Package IPA
        working-directory: ios/build
        run: |
          rm -rf Payload && mkdir Payload
          cp -R NetBirdSSH.xcarchive/Products/Applications/NetBirdSSH.app Payload/
          zip -qry NetBirdSSH-unsigned.ipa Payload
          ls -lh NetBirdSSH-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NetBirdSSH-unsigned-ipa
          path: ios/build/NetBirdSSH-unsigned.ipa

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/NetBirdSSH-unsigned.ipa
