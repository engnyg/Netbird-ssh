name: NetBirdSSH
options:
  bundleIdPrefix: com.engnyg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  NetBirdSSH:
    type: application
    platform: iOS
    sources: [NetBirdSSH]
    dependencies:
      - package: SwiftTerm
      # Produced by `gomobile bind` (see .github/workflows/build-ipa.yml).
      - framework: Frameworks/NBSSHKit.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: NetBirdSSH/Info.plist
      properties:
        CFBundleDisplayName: NetBird SSH
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock SSH private keys with Face ID.
        NSLocalNetworkUsageDescription: Connect to SSH servers on your local network.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engnyg.netbirdssh
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
